<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Library Books API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            text-align: center;
        }
        #search-section {
            max-width: 400px;
            margin: 0 auto 20px;
            padding: 10px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input[type="text"] {
            width: 70%;
            padding: 8px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 8px 12px;
            border: none;
            background-color: #007bff;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        #cover {
            max-width: 200px;
            margin-bottom: 15px;
        }
        h2 {
            margin-top: 0;
        }
    </style>
</head>
<body>

<h1>Поиск книги через Open Library API</h1>

<div id="search-section">
    <input type="text" id="isbn-input" placeholder="Введите ISBN книги" />
    <button onclick="fetchBook()">Поиск</button>
</div>

<div id="result"></div>

<script>
    async function fetchBook() {
        const isbn = document.getElementById('isbn-input').value.trim();
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = '';

        if (!isbn) {
            resultDiv.innerHTML = '<p>Пожалуйста, введите ISBN.</p>';
            return;
        }

        try {
            const response = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
            const data = await response.json();
            const bookKey = `ISBN:${isbn}`;

            if (data[bookKey]) {
                const book = data[bookKey];
                let html = '';

                if (book.cover) {
                    html += `<img id="cover" src="${book.cover.medium}" alt="Обложка книги" />`;
                }

                html += `<h2>${book.title}</h2>`;
                if (book.authors) {
                    const authors = book.authors.map(author => author.name).join(', ');
                    html += `<p><strong>Автор(ы):</strong> ${authors}</p>`;
                }
                if (book.publish_date) {
                    html += `<p><strong>Дата публикации:</strong> ${book.publish_date}</p>`;
                }
                if (book.number_of_pages) {
                    html += `<p><strong>Количество страниц:</strong> ${book.number_of_pages}</p>`;
                }
                if (book.publishers) {
                    const publishers = book.publishers.map(p => p.name).join(', ');
                    html += `<p><strong>Издатели:</strong> ${publishers}</p>`;
                }
                if (book.subjects) {
                    const subjects = book.subjects.map(s => s.name).join(', ');
                    html += `<p><strong>Темы:</strong> ${subjects}</p>`;
                }

                resultDiv.innerHTML = html;
            } else {
                resultDiv.innerHTML = '<p>Книга не найдена по данному ISBN.</p>';
            }
        } catch (error) {
            resultDiv.innerHTML = '<p>Произошла ошибка при получении данных.</p>';
            console.error(error);
        }
    }
</script>

</body>
</html>
